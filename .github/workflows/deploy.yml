name: Deploy QuickPress to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 [1/3] Pulling latest changes from GitHub..."
            cd ~/quickpress
            git pull origin main

            echo "🔨 [2/3] Building Website & updating /var/www/quickpress/website..."
            cd ~/quickpress/website
            npm run build
            sudo rm -rf /var/www/quickpress/website/*
            sudo cp -r dist/* /var/www/quickpress/website/

            echo "🏬 [3/3] Building Partner Portal & restarting PM2..."
            cd ~/quickpress/partner-frontend
            NITRO_PRESET=node-server npm run build
            pm2 restart quickpress-partner || (PORT=8082 pm2 start .output/server/index.mjs --name quickpress-partner && pm2 save)

            sudo nginx -t && sudo systemctl reload nginx
            echo "✅ QuickPress Auto-Deployment Finished Successfully!"
