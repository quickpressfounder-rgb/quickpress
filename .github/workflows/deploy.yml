name: Deploy QuickPress to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 [1/6] Pulling latest changes from GitHub..."
            cd ~/quickpress
            git pull origin main

            echo "🔨 [2/6] Building Website & updating /var/www/quickpress/website (preserving APKs)..."
            cd ~/quickpress/website
            npm install --prefer-offline --no-audit || npm install
            npm run build
            sudo mkdir -p /var/www/quickpress/website/apks
            sudo find /var/www/quickpress/website -mindepth 1 -maxdepth 1 ! -name 'apks' -exec rm -rf {} +
            sudo cp -r dist/* /var/www/quickpress/website/

            echo "🏬 [3/6] Building Partner Portal & restarting PM2..."
            cd ~/quickpress/partner-frontend
            npm install --prefer-offline --no-audit || npm install
            NITRO_PRESET=node-server npm run build
            pm2 restart quickpress-partner || (PORT=8082 pm2 start .output/server/index.mjs --name quickpress-partner && pm2 save)

            echo "🛡️ [4/6] Building Ops / Admin Console & restarting PM2..."
            cd ~/quickpress/admin-frontend
            npm install --prefer-offline --no-audit || npm install
            NITRO_PRESET=node-server npm run build
            pm2 restart quickpress-admin || (PORT=8084 pm2 start .output/server/index.mjs --name quickpress-admin && pm2 save)

            echo "🛵 [5/6] Building Rider Console & updating static files..."
            cd ~/quickpress/rider-frontend
            npm install --prefer-offline --no-audit || npm install
            npm run build
            sudo mkdir -p /var/www/quickpress/rider
            sudo rm -rf /var/www/quickpress/rider/*
            if [ -d ".output/public" ]; then
              sudo cp -r .output/public/* /var/www/quickpress/rider/
            elif [ -d "dist" ]; then
              sudo cp -r dist/* /var/www/quickpress/rider/
            fi
            sudo chown -R www-data:www-data /var/www/quickpress/rider

            echo "🐳 [6/6] Rebuilding & restarting Python FastAPI Backend Container..."
            cd ~/quickpress
            if [ ! -f .env ] && [ -f .env.example ]; then
              cp .env.example .env
            fi
            # Ensure critical Supabase & JWT environment variables exist in .env
            touch .env
            grep -q "DATABASE_URL=" .env || echo "DATABASE_URL=postgresql://postgres.acpxzppgjnqqhckzxcmk:QuickPress%408055@aws-0-ap-south-1.pooler.supabase.com:5432/postgres" >> .env
            grep -q "SUPABASE_URL=" .env || echo "SUPABASE_URL=https://acpxzppgjnqqhckzxcmk.supabase.co" >> .env
            grep -q "SUPABASE_SERVICE_ROLE_KEY=" .env || echo "SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjcHh6cHBnam5xcWhja3p4Y21rIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4Nzc1Mzk3OSwiZXhwIjoyMTAzMzI5OTc5fQ.K-8DkX5NCKuZse6fmemukVfUoRofVpAeY3tH40ZfvXs" >> .env
            grep -q "JWT_SECRET=" .env || echo "JWT_SECRET=09ff549484d531972841b95d2a540fe23d864e21e1bb111d56b6a3ed3bf47b9a" >> .env
            grep -q "ADMIN_EMAILS=" .env || echo "ADMIN_EMAILS=official.quickpress@gmail.com,admin@quickpress.online,admin@quickpress.in" >> .env
            grep -q "PORT=" .env || echo "PORT=8000" >> .env

            sudo docker build -t quickpress-api .
            sudo docker stop quickpress-backend 2>/dev/null || true
            sudo docker rm quickpress-backend 2>/dev/null || true
            FIREBASE_MOUNT=""
            if [ -f "/home/ubuntu/quickpress/quickpress-firebase-service-account.json" ]; then
              FIREBASE_MOUNT="-v /home/ubuntu/quickpress/quickpress-firebase-service-account.json:/app/quickpress-firebase-service-account.json"
            fi
            sudo docker run -d \
              --name quickpress-backend \
              --restart always \
              --env-file .env \
              $FIREBASE_MOUNT \
              -p 127.0.0.1:8000:8000 \
              quickpress-api

            echo "🔍 Verifying backend container status on port 8000..."
            sleep 4
            if sudo docker ps | grep -q "quickpress-backend"; then
              echo "✅ Backend container running healthy on port 8000."
            else
              echo "⚠️ Warning: Backend container exited. Dumping last logs:"
              sudo docker logs --tail 50 quickpress-backend || true
            fi
            echo "🔍 Testing backend HTTP health check on 127.0.0.1:8000..."
            if curl -s -f http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
              echo "✅ Backend API HTTP ping successful (200 OK)."
            else
              echo "⚠️ HTTP ping check pending or warming up. Checking docker logs:"
              sudo docker logs --tail 30 quickpress-backend || true
            fi

            echo "🌐 Syncing Nginx configuration..."
            sudo cp ~/quickpress/scripts/quickpress_nginx.conf /etc/nginx/sites-available/quickpress.conf
            sudo nginx -t && sudo systemctl reload nginx
            echo "✅ QuickPress Full Auto-Deployment Finished Successfully!"
