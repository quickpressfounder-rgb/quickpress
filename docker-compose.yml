version: '3.8'

networks:
  quickpress-net:
    name: quickpress-net
    driver: bridge

volumes:
  quickpress-pgdata:
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: quickpress-postgres
    restart: always
    networks:
      - quickpress-net
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: quickpress
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: QuickPressDB2026Secure
    volumes:
      - /home/ubuntu/quickpress-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quickpress"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    image: quickpress-api
    container_name: quickpress-backend
    restart: always
    networks:
      - quickpress-net
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./quickpress-firebase-service-account.json:/app/quickpress-firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
