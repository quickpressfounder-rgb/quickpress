# ==============================================================================
# QuickPress Multi-Console Platform Nginx Configuration
# Covers: Main Website, Customer App, Partner App, Rider App, Admin App & Backend API
# ==============================================================================

# 1. Main Website (Landing, About, Contact, B2B)
server {
    listen 80;
    listen [::]:80;
    server_name withquickpress.com www.withquickpress.com;

    root /var/www/quickpress/website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

