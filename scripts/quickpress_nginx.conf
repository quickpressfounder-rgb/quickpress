# ==============================================================================
# QuickPress Multi-Domain Nginx Configuration
# Main Website: withquickpress.com (and www.withquickpress.com) -> /var/www/quickpress/website
# Partner Portal: quickpress.online (and www.quickpress.online) -> Node service port 8082
# Backend API: api.withquickpress.com (and api.quickpress.online) -> Docker port 8000
# Admin Console: admin.withquickpress.com -> /var/www/quickpress/admin
# ==============================================================================

# 1. Main Website (Official Landing, About Us, Contact Us, B2B Bulk Order)
server {
    listen 80;
    listen [::]:80;
    server_name withquickpress.com www.withquickpress.com;

    root /var/www/quickpress/website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# 2. Partner Laundromat Desktop Portal (TanStack Start Node.js service on port 8082)
server {
    listen 80;
    listen [::]:80;
    server_name quickpress.online www.quickpress.online partner.withquickpress.com;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}

# 3. Super Admin & Operations Console (TanStack Start Node.js service on port 8084)
server {
    listen 80;
    listen [::]:80;
    server_name ops.withquickpress.com admin.withquickpress.com admin.quickpress.online;

    client_max_body_size 50M;

    # Security & Anti-Bot Protection
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}

# 4. Python FastAPI Backend API (Reverse Proxy to Docker container on port 8000)
# Used by: Website, Partner Portal, Customer APK, Captain APK
server {
    listen 80;
    listen [::]:80;
    server_name api.withquickpress.com api.quickpress.online;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}
