# ==============================================================================
# QuickPress Multi-Domain Nginx Configuration
# Main Website: withquickpress.com (and www.withquickpress.com)
# Partner Portal: quickpress.online (and www.quickpress.online)
# Backend API: api.withquickpress.com (and api.quickpress.online)
# Admin Console: admin.withquickpress.com
# ==============================================================================

# 1. Main Website (Official Landing, About Us, Contact Us, B2B Bulk Order)
server {
    listen 80;
    listen [::]:80;
    server_name withquickpress.com www.withquickpress.com;

    root /var/www/quickpress/website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# 2. Partner Laundromat Desktop Portal (Self-Onboarding & Order Management)
server {
    listen 80;
    listen [::]:80;
    server_name quickpress.online www.quickpress.online partner.withquickpress.com;

    root /var/www/quickpress/partner;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# 3. Super Admin Console
server {
    listen 80;
    listen [::]:80;
    server_name admin.withquickpress.com admin.quickpress.online;

    root /var/www/quickpress/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# 4. Python FastAPI Backend API (Reverse Proxy to Docker container on port 8000)
# Used by: Website, Partner Portal, Customer APK, Captain APK
server {
    listen 80;
    listen [::]:80;
    server_name api.withquickpress.com api.quickpress.online;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}
