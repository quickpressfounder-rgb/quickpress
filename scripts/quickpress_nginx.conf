# ==============================================================================
# QuickPress Multi-Domain Nginx Configuration with Full SSL (Ports 80 & 443)
# Main Website: withquickpress.com (and www.withquickpress.com) -> /var/www/quickpress/website
# Partner Portal: quickpress.online (and www.quickpress.online) -> Node service port 8082
# Backend API: api.withquickpress.com (and api.quickpress.online) -> Docker port 8000
# Admin & Ops Console: ops.withquickpress.com -> Node service port 8084
# ==============================================================================

# Cloudflare Real IP Restoration (Ensures real client IP is logged & passed to backend)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# 1. Main Website (Official Landing, About Us, Contact Us, B2B Bulk Order)
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name withquickpress.com www.withquickpress.com;

    ssl_certificate /etc/letsencrypt/live/withquickpress.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/withquickpress.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/quickpress/website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# 2. Partner Laundromat Desktop Portal (TanStack Start Node.js service on port 8082)
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quickpress.online www.quickpress.online partner.withquickpress.com;

    ssl_certificate /etc/letsencrypt/live/withquickpress.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/withquickpress.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}

# 3. Super Admin & Operations Console (TanStack Start Node.js service on port 8084)
# Protected by Cloudflare Zero Trust (Access) + Anti-Bot Perimeter
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ops.withquickpress.com admin.withquickpress.com admin.quickpress.online;

    ssl_certificate /etc/letsencrypt/live/withquickpress.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/withquickpress.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Security & Anti-Bot Protection
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
        proxy_set_header CF-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
        proxy_set_header CF-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}

# 4. Python FastAPI Backend API (Reverse Proxy to Docker container on port 8000)
# Used by: Website, Partner Portal, Customer APK, Captain APK
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.withquickpress.com api.quickpress.online;

    ssl_certificate /etc/letsencrypt/live/withquickpress.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/withquickpress.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}
